name: CI

on:
  push:
    branches: [main, dev, development, develop, Truonghoang]
  pull_request:
    branches: [main, dev, development, develop, Truonghoang]

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fixhome
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Runtime dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Integration tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_NAME: fixhome
          JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters
          JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters
          MAIL_TRANSPORT: json

  deploy:
    name: Deploy to VPS
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: deploy-vps
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/backend
            git pull --ff-only
            # Reject an existing P1 finance cutover rather than override its semantics.
            if [ -f .env ] && grep -Eq '^[[:space:]]*P1_CUSTODY_ENABLED[[:space:]]*=[[:space:]]*["\x27]?true["\x27]?[[:space:]]*$' .env; then
              echo "Blocked: VPS env currently enables P1 finance custody"
              exit 1
            fi
            # Dev-only, non-secret Compose overlay; do not change payout/settlement.
            # Abort if an existing container is using finance custody (P1).
            existing="$(docker compose -f docker-compose.prod.yml ps -q backend || true)"
            if [ -n "$existing" ] && docker inspect "$existing" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fxq 'P1_CUSTODY_ENABLED=true'; then
              echo "Blocked: existing backend uses P1 finance custody"
              exit 1
            fi
            docker compose -f docker-compose.prod.yml -f docker-compose.part-returns.dev.yml up -d --build backend
            active="$(docker compose -f docker-compose.prod.yml -f docker-compose.part-returns.dev.yml ps -q backend)"
            test -n "$active"
            runtime_flags="$(docker inspect "$active" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -E '^(PART_RETURNS_TRACKING_ENABLED|P1_CUSTODY_ENABLED)=')"
            printf '%s\n' "$runtime_flags" | grep -Fxq 'PART_RETURNS_TRACKING_ENABLED=true'
            printf '%s\n' "$runtime_flags" | grep -Fxq 'P1_CUSTODY_ENABLED=false'
            echo "Dev-only physical returns tracking configured; finance custody remains disabled"
            docker image prune -f
