name: CI

on:
  push:
    branches: [main, dev, development, develop, Truonghoang]
  pull_request:
    branches: [main, dev, development, develop, Truonghoang]

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fixhome
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Runtime dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Isolated voucher lifecycle PostgreSQL gate
        run: npx vitest run src/modules/vouchers/voucher-campaign.postgres.spec.ts
        env:
          VOUCHER_CAMPAIGN_ISOLATED_PG: '1'
      - name: Isolated cash and reputation PostgreSQL migration gate
        run: npx vitest run src/database/cash-reputation.postgres.spec.ts
        env:
          CASH_REPUTATION_ISOLATED_PG: '1'
      - name: Isolated W3 warehouse delivery PostgreSQL migration gate
        run: npx vitest run src/database/w3-dev-release-gate.spec.ts src/database/w3-dev-release.postgres.spec.ts
        env:
          W3_DEV_ISOLATED_PG: '1'
      - name: W3 zero-fee invoice PostgreSQL regression
        run: npx vitest run --config vitest.config.e2e.ts test/warehouse-delivery-physical.e2e-spec.ts -t '0016'
      - name: Integration tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_NAME: fixhome
          JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters
          JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters
          MAIL_TRANSPORT: json

  deploy:
    name: Deploy to VPS
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: deploy-vps
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/backend
            git pull --ff-only
            # The committed DEV overlay is the activation authority. A separate
            # reviewed overlay commit changes both flags after Web and DB QA.
            if grep -Eq '^[[:space:]]*CASH_FIRST_ENABLED:[[:space:]]*"true"[[:space:]]*$' docker-compose.part-returns.dev.yml; then
              desired_cash_first=true
              activation=1
            elif grep -Eq '^[[:space:]]*CASH_FIRST_ENABLED:[[:space:]]*"false"[[:space:]]*$' docker-compose.part-returns.dev.yml; then
              desired_cash_first=false
              activation=0
            else
              echo "Blocked: DEV overlay must explicitly set CASH_FIRST_ENABLED"
              exit 1
            fi
            if [ "$desired_cash_first" = true ] && ! grep -Eq '^[[:space:]]*CASH_LEGACY_COMPAT_ENABLED:[[:space:]]*"true"[[:space:]]*$' docker-compose.part-returns.dev.yml; then
              echo "Blocked: Mobile compatibility must be enabled for DEV cash-first"
              exit 1
            fi
            # Reject an existing P1 finance cutover rather than override its semantics.
            if [ -f .env ] && grep -Eq '^[[:space:]]*P1_CUSTODY_ENABLED[[:space:]]*=[[:space:]]*["\x27]?true["\x27]?[[:space:]]*$' .env; then
              echo "Blocked: VPS env currently enables P1 finance custody"
              exit 1
            fi
            # Dev-only, non-secret Compose overlay; do not change payout/settlement.
            # Abort if an existing container is using finance custody (P1).
            existing="$(docker compose -f docker-compose.prod.yml ps -q backend || true)"
            if [ -n "$existing" ] && docker inspect "$existing" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fxq 'P1_CUSTODY_ENABLED=true'; then
              echo "Blocked: existing backend uses P1 finance custody"
              exit 1
            fi
            # Do not downgrade an active cash-first backend to legacy mode.
            if [ "$desired_cash_first" != true ] && [ -n "$existing" ] && docker inspect "$existing" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fxq 'CASH_FIRST_ENABLED=true'; then
              echo "Blocked: existing backend has cash-first enabled but DEV overlay does not"
              exit 1
            fi
            # Prepare a new image while the previous DEV backend keeps serving.
            # Fail closed unless the exact W3 migrations 0004-0013, their
            # prerequisites, schema/RLS/grants and the exact two cash/reputation
            # migrations pass in disposable one-offs. W3 runs first and leaves
            # the cash pair pending for its unchanged gate; neither gate touches
            # Production.
            # On failure, DO NOT restart the working Backend container.
            docker compose -f docker-compose.prod.yml -f docker-compose.part-returns.dev.yml build backend
            # Apply the exact additive geo schema before the unchanged W3/cash migration gates.
            docker compose -f docker-compose.prod.yml -f docker-compose.part-returns.dev.yml run --rm --no-deps -e WAREHOUSE_GEO_DEV_RELEASE=1 backend node dist/database/warehouse-geo-dev-release.js
            # Office visits for technician review (additive); applied here so the W3/cash gates do not see an unknown pending migration.
            docker compose -f docker-compose.prod.yml -f docker-compose.part-returns.dev.yml run --rm --no-deps -e TECHNICIAN_OFFICE_VISITS_DEV_RELEASE=1 backend node dist/database/technician-office-visits-dev-release.js
            # BUG DETECTOR 59: visit_groups.address_id nullable + ON DELETE SET NULL (existing column/constraint only).
            docker compose -f docker-compose.prod.yml -f docker-compose.part-returns.dev.yml run --rm --no-deps -e VISIT_GROUP_ADDRESS_DEV_RELEASE=1 backend node dist/database/visit-group-address-dev-release.js
            # TECH 42: technician_assignments.private_note (additive nullable column, no new table).
            docker compose -f docker-compose.prod.yml -f docker-compose.part-returns.dev.yml run --rm --no-deps -e TECHNICIAN_PRIVATE_NOTE_DEV_RELEASE=1 backend node dist/database/technician-private-note-dev-release.js
            # BUG DETECTOR 62: voucher_campaigns.per_customer_limit (additive column; per-customer unique index becomes a service rule).
            docker compose -f docker-compose.prod.yml -f docker-compose.part-returns.dev.yml run --rm --no-deps -e VOUCHER_PER_CUSTOMER_DEV_RELEASE=1 backend node dist/database/voucher-per-customer-dev-release.js
            docker compose -f docker-compose.prod.yml -f docker-compose.part-returns.dev.yml run --rm --no-deps -e W3_DEV_RELEASE=1 backend node dist/database/w3-dev-release.js
            docker compose -f docker-compose.prod.yml -f docker-compose.part-returns.dev.yml run --rm --no-deps -e CASH_REPUTATION_DEV_RELEASE=1 -e CASH_FIRST_DEV_ACTIVATION="$activation" backend node dist/database/cash-reputation-dev-release.js
            docker compose -f docker-compose.prod.yml -f docker-compose.part-returns.dev.yml up -d --no-build backend
            active="$(docker compose -f docker-compose.prod.yml -f docker-compose.part-returns.dev.yml ps -q backend)"
            test -n "$active"
            runtime_flags="$(docker inspect "$active" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -E '^(PART_RETURNS_TRACKING_ENABLED|P1_CUSTODY_ENABLED|CASH_FIRST_ENABLED|CASH_LEGACY_COMPAT_ENABLED)=')"
            printf '%s\n' "$runtime_flags" | grep -Fxq 'PART_RETURNS_TRACKING_ENABLED=true'
            printf '%s\n' "$runtime_flags" | grep -Fxq 'P1_CUSTODY_ENABLED=false'
            printf '%s\n' "$runtime_flags" | grep -Fxq "CASH_FIRST_ENABLED=$desired_cash_first"
            if [ "$desired_cash_first" = true ]; then
              printf '%s\n' "$runtime_flags" | grep -Fxq 'CASH_LEGACY_COMPAT_ENABLED=true'
            fi
            echo "DEV cash-first overlay verified; finance custody remains disabled"
            docker image prune -f
